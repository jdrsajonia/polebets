# API Gateway (T2-01) — única entrada web de los jugadores.
#
# Archivos (T3-01, uno por responsabilidad para no pisarse):
#   nginx.conf          servers, puertos y TLS (escenario 1)
#   rutas.conf          rutas de los jugadores
#   admin.conf          ruta hacia Admin (escenario 2)
#   limites-zonas.conf  zonas de limit_req, nivel http (escenario 5)
#
# Se monta como conf.d/default.conf (dentro del bloque http de nginx).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 8080;
    server_name _;

    ssl_certificate /etc/nginx/certs/polebet.crt;
    ssl_certificate_key /etc/nginx/certs/polebet.key;

    resolver 127.0.0.11 valid=10s;

    # Nadie entra con una identidad puesta por el cliente: solo vale la que
    # añade el Gateway tras auth_request. Se neutralizan en toda petición.
    # Un location con proxy_set_header propios no hereda estos: por eso se
    # repiten en cada location que hace proxy.
    proxy_set_header X-User-Id    "";
    proxy_set_header X-User-Rol   "";
    proxy_set_header X-User-Token "";

    include /etc/nginx/polebet/rutas.conf;
    include /etc/nginx/polebet/admin.conf;
}
