    # ---- Passthrough temporal al Front (hasta que llegue T2-01) ----
    # El Gateway todavía no enruta por su cuenta login/REST/WS. Mientras tanto
    # reenvía TODO al Front, cuyo Nginx ya hace de proxy a /api/pagos y
    # /api/motor (incluido el WebSocket). Así la app abre en http://localhost y
    # el flujo del P1 sigue funcionando sin publicar puertos internos ni esperar
    # a T2-01. Cuando se implementen las rutas reales de arriba, este bloque se
    # reemplaza por el enrutamiento auth_request + login/REST/WS.
    location / {
        set $front http://front:80;
        proxy_pass $front;
        # $http_host conserva el puerto; el motor compara Origin contra Host
        # para aceptar el WebSocket same-origin (ver motor internal/ws).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Permitir el Upgrade a WebSocket que viaja por /api/motor/ws.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
