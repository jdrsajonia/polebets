# API Gateway — STUB base (T2-04). Lo completa T2-01 (Tomás).
#
# Hoy solo responde GET /health para que el contenedor arranque y todo el stack
# levante con un solo comando. Las rutas reales están ESBOZADAS y comentadas
# abajo: son el punto de partida de T2-01, no configuración activa todavía.
#
# Este archivo se monta como conf.d/default.conf (dentro del bloque http de
# nginx). El `map` para WebSocket vive en contexto http, por eso va aquí arriba.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # DNS interno de Docker, para resolver los nombres de servicio en runtime.
    resolver 127.0.0.11 valid=10s;

    # ---- Healthcheck del propio Gateway (stub T2-04) ----
    location = /health {
        add_header Content-Type application/json;
        return 200 '{"estado":"ok","servicio":"gateway","nota":"stub T2-04"}';
    }

