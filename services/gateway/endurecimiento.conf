# Endurecimiento del Gateway (escenario 2, T3-03). Nivel http: aplica a TODOS los
# servers (también al del 80 que redirige a HTTPS). Si fuera en admin.conf solo
# cubriría el server 443/8080.
#
# No revelar la versión de Nginx en la cabecera Server ni en las páginas de error:
# "nginx" en vez de "nginx/1.27.x" (no regalar qué CVE probar).
server_tokens off;
