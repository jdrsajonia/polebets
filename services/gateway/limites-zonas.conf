# Zonas de limit_req / limit_conn (escenario 5). Nivel http: Nginx no las acepta dentro de server.
#
# Rate limiting del login (táctica "Limit access / Restrict login", BASS 11.2).
# Línea base medida sin límite: el login se cae entre 60 y 65 usuarios
# (~20 logins/s). Se limita por IP a 10 peticiones/s, por debajo de esa capacidad.

# Zona por IP de cliente: 10 MB guardan ~160 mil IPs.
limit_req_zone  $binary_remote_addr zone=login_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=login_conn:10m;

# Al superar el límite responde 429 (por defecto sería 503) y lo deja en el log.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# Zona general para el resto de /api/ (orquestador, protegido por
# auth_request): cada petición protegida también consulta a Usuarios, así
# que una ráfaga la recarga igual que al login, aunque menos por petición.
# Más holgada que la del login porque aquí sí hay tráfico normal variado
# (apostar, ver eventos, billetera).
limit_req_zone  $binary_remote_addr zone=api_req:10m rate=50r/s;

# Conexiones abiertas del WebSocket (/api/ws): cada jugador viendo la
# carrera mantiene una. El tope es generoso para no cortar a alguien con
# varias pestañas o a una IP compartida (universidad, oficina); solo frena
# a quien abre cientos para agotar el servidor.
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
