# Ruta hacia Admin (escenario 2, reverse proxy, T3-03). Se incluye en el server 443/8080.
#
#   /api/admin/  -> Admin (puerto 8003), sin el prefijo: /api/admin/login -> /login
#
# Admin ya no publica puerto al host: el Gateway es su única puerta (red gw_admin).
# Prefijo /api/admin/ y no /admin/: /admin es una ruta de la SPA (HU-11/12) y va al
# Front. Al ser el prefijo más largo, este location gana sobre /api/ de rutas.conf.
#
# Sin auth_request, a propósito: el /_auth de rutas.conf valida la cookie de los
# jugadores, y la CLI manda `Authorization: Bearer <token>`. Admin ya valida ese
# token en cada petición contra Usuarios y exige rol admin (services/admin/app/sesion.py).
# Authorization se reenvía tal cual (comportamiento por defecto de Nginx).
# El Gateway aporta: punto único de entrada, TLS, ocultamiento (sin docs ni versión)
# y el sitio donde el escenario 5 pondrá el límite de intentos de /api/admin/login.

location /api/admin/ {
    # Variable + resolver (como en rutas.conf): Nginx arranca aunque Admin no esté.
    set $admin http://admin:8003;
    rewrite ^/api/admin/(.*)$ /$1 break;
    proxy_pass $admin;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Los proxy_set_header de un location no heredan los del server: se repiten.
    proxy_set_header X-User-Id         "";
    proxy_set_header X-User-Rol        "";
    proxy_set_header X-User-Token      "";
}
