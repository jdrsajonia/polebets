# Connection: "upgrade" solo cuando el cliente pide Upgrade (WebSocket); si no,
# "close". Este map vive en contexto http: este archivo se incluye dentro del
# bloque http del nginx.conf principal (se monta como conf.d/default.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nombres de servicio de docker-compose (red interna arqui_net). Nginx
    # resuelve estos hosts por el DNS interno de Docker, no por localhost: por
    # eso el front NO necesita saber la IP/dominio publico, y el mismo bundle
    # sirve en localhost, en la LAN y en la nube sin recompilar.
    resolver 127.0.0.11 valid=10s;

    # ---- API de Pagos y usuarios (REST) ----
    # El front llama a /api/pagos/... (ver services/front/src/api/config.ts).
    # Se quita el prefijo /api/pagos antes de reenviar a Pagos.
    location /api/pagos/ {
        set $pagos_upstream http://pagos:8000;
        rewrite ^/api/pagos/(.*)$ /$1 break;
        proxy_pass $pagos_upstream;
        # $http_host conserva el puerto (p. ej. 192.168.1.101:5173); $host lo
        # quita, y el motor compara Origin contra Host para el WebSocket.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API del Motor de apuestas (REST + WebSocket) ----
    # El front llama a /api/motor/... y abre el WebSocket en /api/motor/ws.
    location /api/motor/ {
        set $motor_upstream http://motor:8080;
        rewrite ^/api/motor/(.*)$ /$1 break;
        proxy_pass $motor_upstream;
        # $http_host conserva el puerto; el motor compara Origin con Host para
        # aceptar el WebSocket same-origin (ver internal/ws/handler.go).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade a WebSocket (GET /api/motor/ws). El motor valida el Origin,
        # que Nginx reenvia sin tocar: ese origen debe estar en ALLOWED_ORIGINS.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;   # el WebSocket queda abierto; no cerrarlo por inactividad
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router luego).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
