# Prototipo 2 - ArquiSoft (PoleBet) — T2-04
#
# Levanta TODO el prototipo con un solo comando:
#
#   docker compose up --build
#
# Esta es la BASE del prototipo 2 (T2-04, Tomás). Los servicios de lógica que
# todavía no tienen su implementación real corren como STUB: una imagen mínima
# que solo responde GET /health, para que el stack entero arranque desde ya y
# cada dueño construya su servicio encima sin tocar la topología (redes,
# puertos, nombres y dependencias ya están decididos aquí).
#
#   Estado por servicio:
#     gateway        REAL  (Nginx)        -> T2-01  Tomás (login/registro/auth_request activos; falta WS)
#     front          REAL  (Node: SPA + SSR) -> HU2-03 Misael, puerto interno 3000
#     orquestador    REAL  (Go)           -> T2-02  Daniel (PR en revisión)
#     usuarios       REAL  (FastAPI)      -> login, auth_request y cuentas (HU2-01/02, Misael)
#     pagos          REAL  (FastAPI)      -> ya existía; dueño de PG Pagos
#     pagos-consumer REAL  (misma imagen de pagos, comando placeholder) -> HU2-18 consumidor AMQP
#     motor          REAL  (Go)           -> ya existía; lee Mongo, escribe Redis
#     ingestor       REAL  (Go)           -> HU2-16/19 Iván; descarga OpenF1, reproduce; único que escribe Mongo
#     admin          REAL  (FastAPI)      -> HU2-18/19/23 Iván; detrás del Gateway en /api/admin/ (T3-03)
#
#   Cliente fuera del conteo (perfil "cli", no lo levanta `docker compose up`):
#     cli            Rust (ratatui)       -> HU2-17 William; `docker compose run --rm cli`
#
#   Infra (imágenes oficiales, ya funcionan):
#     postgres-usuarios, postgres-pagos, mongo, redis, rabbitmq
#
# Puertos publicados al host: SOLO 80 y 443, los dos del Gateway. Todo lo demás
# es interno a las redes de Docker (RNF-17: no se exponen los puertos internos).
# Admin ya no se publica: se alcanza por el Gateway en /api/admin/ (escenario 2,
# T3-03, reverse proxy).
#
# Redes (Vista C&C): una por relación "quién habla con quién" (escenario 3), ver
# la tabla al final. Cada base comparte red SOLO con su servicio dueño.
#
# Configuración en .env (ver .env.example).

name: arquisoft-prototipo2

services:
  # ===========================================================================
  # Bases de datos (datos)
  # ===========================================================================

  # PostgreSQL Usuarios — dueño: servicio usuarios. Tabla users.
  postgres-usuarios:
    image: postgres:17-alpine
    container_name: arqui_pg_usuarios
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USUARIOS_DB_USER}
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD}
      POSTGRES_DB: ${USUARIOS_DB_NAME}
    volumes:
      - pg_usuarios_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USUARIOS_DB_USER} -d ${USUARIOS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Solo con su dueño (usuarios). Red interna: sin salida a Internet.
    networks:
      - datos_usuarios

  # PostgreSQL Pagos — dueño: servicio pagos (y su consumidor).
  # wallets, events, event_entries, markets, bets, ledger_entries.
  postgres-pagos:
    image: postgres:17-alpine
    container_name: arqui_pg_pagos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PAGOS_DB_USER}
      POSTGRES_PASSWORD: ${PAGOS_DB_PASSWORD}
      POSTGRES_DB: ${PAGOS_DB_NAME}
    volumes:
      - pg_pagos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAGOS_DB_USER} -d ${PAGOS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Solo con sus dueños (pagos y su consumidor). Red interna: sin Internet.
    networks:
      - datos_pagos

  # MongoDB — dueño de escritura: ingestor. El motor solo lee.
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet"]
    container_name: arqui_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 10
    # Dueños: motor (lee) e ingestor (escribe). Red interna: sin Internet.
    networks:
      - datos_mongo

  # Redis — dueño: motor (fichas y ranking del torneo en curso).
  redis:
    image: redis:7-alpine
    container_name: arqui_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Solo con su dueño (motor). Red interna: sin Internet.
    networks:
      - datos_redis

  # Broker (RabbitMQ) — mensajería asíncrona Admin <-> Pagos / Ingestor.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: arqui_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    # Broker: solo con quienes publican/consumen (admin, pagos-consumer, ingestor).
    networks:
      - broker

  # ===========================================================================
  # Entrada (borde)
  # ===========================================================================

  # API Gateway (T2-01). Única entrada al sistema: jugadores (web) y, desde el
  # escenario 2 (T3-03), también el administrador (CLI) por /api/admin/.
  gateway:
    build:
      context: ./services/gateway
    container_name: arqui_gateway
    restart: unless-stopped
    depends_on:
      - usuarios
      - orquestador
      - motor
      - front
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/gateway/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    # borde: entrada web + Front (SSR). gw_backend: llega a Usuarios, Orquestador y Motor.
    # gw_admin: llega a Admin (reverse proxy de /api/admin/, escenario 2).
    networks:
      - borde
      - gw_backend
      - gw_admin

  # Front (Node, HU2-03 Misael): sirve la SPA y renderiza /mi-pagina en el servidor (SSR).
  front:
    build:
      context: ./services/front
      # HU2-15: el visor de pista (C# / Blazor) se compila dentro de la imagen
      # del Front y se sirve con la SPA (ver services/front/Dockerfile).
      additional_contexts:
        visor: ./services/visor
    container_name: arqui_front
    restart: unless-stopped
    environment:
      PORT: "3000"
      # El servidor SSR pide los datos de /mi-pagina al Gateway reenviando la
      # cookie del jugador (HU2-03); el Gateway la valida como cualquier /api/*.
      GATEWAY_URL: http://gateway:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    # El Front (SSR) solo habla con el Gateway: basta la red de borde.
    networks:
      - borde

  # Admin (HU2-17/18/19/23, Iván). Sin puerto publicado: solo lo alcanza el
  # Gateway por gw_admin, que lo expone en /api/admin/ (escenario 2, T3-03).
  admin:
    build:
      context: ./services/admin
    container_name: arqui_admin
    restart: unless-stopped
    depends_on:
      usuarios:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # HU2-17 (RF-21): valida el login de la CLI y su token contra Usuarios.
      USUARIOS_BASE_URL: http://usuarios:8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s
    # gw_admin: único camino de entrada (desde el Gateway). Admin llega a Usuarios
    # (valida login/token de la CLI) y a RabbitMQ (publica consultas). Ninguna de
    # sus redes sale a Internet ni publica puertos.
    networks:
      - gw_admin
      - admin_usuarios
      - broker

  # CLI del administrador (HU2-17, Rust). No es un servicio: es la terminal del
  # admin, empaquetada para correrla sin instalar Rust. El perfil "cli" la deja
  # fuera de `docker compose up`; se abre con:
  #   docker compose run --rm cli
  # PENDIENTE (T3-06): pasarla al Gateway por HTTPS. Mientras tanto queda en
  # borde y ya no alcanza a Admin (admin_entrada desapareció en T3-03).
  cli:
    build:
      context: ./services/cli
    profiles: ["cli"]
    stdin_open: true
    tty: true
    depends_on:
      - admin
    environment:
      POLEBET_ADMIN_URL: http://admin:8003
    networks:
      - borde

  # ===========================================================================
  # Lógica (interna)
  # ===========================================================================

  # Orquestador — REAL (T2-02, Daniel). Coordina flujos; no tiene base propia.
  # Se construye desde ./services/orquestador tal cual lo crea su PR, sin tocar
  # esa carpeta, para no generar conflictos cuando el PR se mergee.
  orquestador:
    build:
      context: ./services/orquestador
    container_name: arqui_orquestador
    restart: unless-stopped
    environment:
      USUARIOS_BASE_URL: http://usuarios:8001
      PAGOS_BASE_URL: http://pagos:8000
      MOTOR_BASE_URL: http://motor:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      HTTP_PORT: "8081"
    depends_on:
      - usuarios
      - pagos
      - motor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    # gw_backend: lo llama el Gateway. orq_backend: llega a Usuarios, Pagos y Motor.
    networks:
      - gw_backend
      - orq_backend

  # Usuarios — REAL (HU2-01/02, Misael). Dueño de PG Usuarios: cuentas, login,
  # JWT en cookie y GET /internal/auth para el auth_request del Gateway.
  usuarios:
    build:
      context: ./services/usuarios
    container_name: arqui_usuarios
    restart: unless-stopped
    environment:
      SESSION_COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://${USUARIOS_DB_USER}:${USUARIOS_DB_PASSWORD}@postgres-usuarios:5432/${USUARIOS_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Administrador inicial (RF-21): Usuarios lo crea al arrancar si falta.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
    depends_on:
      postgres-usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8001/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s
    # Lo llaman: Gateway (auth_request), Orquestador y Admin. Dueño de PG Usuarios.
    networks:
      - gw_backend
      - orq_backend
      - admin_usuarios
      - datos_usuarios

  # Pagos — REAL. Dueño de PG Pagos (tablas del P2, T2-03). Solo rutas
  # /internal/*: lo llaman el Orquestador y el Motor, nunca el navegador.
  pagos:
    build:
      context: ./services/pagos
    container_name: arqui_pagos
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${PAGOS_DB_USER}:${PAGOS_DB_PASSWORD}@postgres-pagos:5432/${PAGOS_DB_NAME}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      COP_PER_TOKEN: ${COP_PER_TOKEN}
    depends_on:
      postgres-pagos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 2s
    # Lo llaman el Orquestador (orq_backend) y el Motor (motor_pagos). Dueño de PG Pagos.
    networks:
      - orq_backend
      - motor_pagos
      - datos_pagos

  # Consumidor AMQP de Pagos — misma imagen de pagos, proceso aparte.
  # HU2-21 (Guillermo): toma las consultas del administrador de RabbitMQ
  # (cola admin.consultas, prefetch 1) y responde por reply_to con
  # correlation_id. Las publica Admin (HU2-18, Iván) cuando exista.
  pagos-consumer:
    build:
      context: ./services/pagos
    container_name: arqui_pagos_consumer
    restart: unless-stopped
    command: ["python", "-m", "app.consumer"]
    environment:
      DATABASE_URL: postgresql+psycopg://${PAGOS_DB_USER}:${PAGOS_DB_PASSWORD}@postgres-pagos:5432/${PAGOS_DB_NAME}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres-pagos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Consume de RabbitMQ (broker) y lee/escribe su PG Pagos.
    networks:
      - broker
      - datos_pagos

  # Motor de apuestas — REAL. Lee Mongo (solo lectura), escribe Redis.
  motor:
    build:
      context: ./services/motor
    container_name: arqui_motor
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      PAGOS_BASE_URL: http://pagos:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      BETTING_WINDOW_SECONDS: ${BETTING_WINDOW_SECONDS}
      OBSERVATION_WINDOW_SECONDS: ${OBSERVATION_WINDOW_SECONDS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      HTTP_PORT: "8080"
      # HU2-11: parametros del torneo para el ranking y la barra de avance.
      # Los mismos nombres que usa Pagos (HU2-06); valores por defecto si no
      # estan en el .env. El motor igual trae defaults internos (1000/10/50).
      EVENT_INITIAL_CHIPS: ${EVENT_INITIAL_CHIPS:-1000}
      EVENT_COMMISSION_PCT: ${EVENT_COMMISSION_PCT:-10}
      EVENT_MIN_WAGER_PCT: ${EVENT_MIN_WAGER_PCT:-50}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      pagos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 2s
    # Lo llaman Gateway (WebSocket, gw_backend) y Orquestador (orq_backend).
    # Llega a Pagos (motor_pagos), lee Mongo (datos_mongo) y escribe Redis (datos_redis).
    networks:
      - gw_backend
      - orq_backend
      - motor_pagos
      - datos_mongo
      - datos_redis

  # Ingestor — STUB (HU2-16/19, Iván). Único que ESCRIBE en Mongo. Habla con el Broker.
  ingestor:
    build:
      context: ./services/ingestor
    container_name: arqui_ingestor
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      HTTP_PORT: "8002"
      # Opcional: el histórico de OpenF1 es gratis sin token.
      OPENF1_API_KEY: ${OPENF1_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s
    # Único que escribe Mongo (datos_mongo) y habla con el Broker (broker). Es el
    # ÚNICO con salida a Internet: la red ingestor_salida no es `internal`, así
    # descarga el histórico de OpenF1. El resto de redes de datos sí son internas.
    networks:
      - datos_mongo
      - broker
      - ingestor_salida

# =============================================================================
# Redes (Vista C&C) — segmentación por zona de confianza (Escenario 3, T3-02).
#
# Cada red reúne SOLO a quienes deben hablar entre sí (tabla "quién habla con
# quién"). Docker aísla redes distintas por defecto, así que la membresía de red
# funciona como regla de filtrado y contiene el movimiento lateral.
#
#   borde           entrada web + Front(SSR) <-> Gateway
#   gw_backend      Gateway -> Usuarios, Orquestador, Motor
#   orq_backend     Orquestador -> Usuarios, Pagos, Motor
#   motor_pagos     Motor -> Pagos
#   gw_admin        Gateway -> Admin (reverse proxy de /api/admin/, escenario 2, T3-03)
#   admin_usuarios  Admin -> Usuarios
#   broker          Admin, Pagos-consumer, Ingestor -> RabbitMQ
#   datos_*         cada base con su(s) dueño(s) — internal: true (sin Internet)
#   ingestor_salida ÚNICA red con salida a Internet (solo el Ingestor: OpenF1)
# =============================================================================
networks:
  borde:
    driver: bridge
  gw_backend:
    driver: bridge
    internal: true
  orq_backend:
    driver: bridge
    internal: true
  motor_pagos:
    driver: bridge
    internal: true
  gw_admin:
    driver: bridge
    internal: true
  admin_usuarios:
    driver: bridge
    internal: true
  broker:
    driver: bridge
    internal: true
  datos_usuarios:
    driver: bridge
    internal: true
  datos_pagos:
    driver: bridge
    internal: true
  datos_mongo:
    driver: bridge
    internal: true
  datos_redis:
    driver: bridge
    internal: true
  ingestor_salida:
    driver: bridge

volumes:
  pg_usuarios_data:
  pg_pagos_data:
  mongo_data:
